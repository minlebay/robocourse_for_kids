services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: learn_kids
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - learn_kids_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
      - .test.env
    expose:
      - "8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/learn_kids?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - learn_kids_net

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8888:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - learn_kids_net

volumes:
  db_data:

networks:
  learn_kids_net:
    driver: bridge
